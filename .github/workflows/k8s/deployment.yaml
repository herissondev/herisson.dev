apiVersion: apps/v1
kind: Deployment
metadata:
    name: herisson-dev
    namespace: herissondev
    labels:
        app: herisson-dev
spec:
    replicas: 1
    selector:
        matchLabels:
            app: herisson-dev
    template:
        metadata:
            labels:
                app: herisson-dev
        spec:
            containers:
                - name: herisson-dev
                  image: aimerisson/herisson.dev:latest
                  ports:
                      - containerPort: 4000

                  env:
                      -   name: SECRET_KEY_BASE
                          valueFrom:
                              secretKeyRef:
                                  name: herissondev-secret
                                  key: SECRET_KEY_BASE
                      -   name: PHX_HOST
                          # env is herisson.dev
                          value: herisson.dev
                      # Recruiting demo: model API keys
                      -   name: OPENROUTER_API_KEY
                          valueFrom:
                              secretKeyRef:
                                  name: herissondev-secret
                                  key: OPENROUTER_API_KEY
                      -   name: TYPESAFE_API_KEY
                          valueFrom:
                              secretKeyRef:
                                  name: herissondev-secret
                                  key: TYPESAFE_API_KEY

                  imagePullPolicy: Always
                  resources:
                      requests:
                          cpu: '500m'

